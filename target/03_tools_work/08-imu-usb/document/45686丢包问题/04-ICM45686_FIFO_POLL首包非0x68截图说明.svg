  <g fill="#d8d8d8" font-family="Consolas, 'Courier New', monospace" font-size="20">
    <text x="40" y="314">关键信息</text>
    <text x="140" y="314">1. 在合法包头 0x68 出现之前，前面已经有一段非 0x68 的前导异常字节流。</text>
    <text x="140" y="344">2. 红框中的 4C 89 是被截断异常包残留下来的 timestamp 尾字段。</text>
    <text x="140" y="374">3. 该 timestamp 与前一个 2 ms poll 最后一包及后续合法包保持连续，说明包确实丢失而非采样停摆。</text>
    <text x="140" y="404">4. 因而问题本质是 FIFO 读回/包边界对齐异常，而不是传感器没有继续产数。</text>
  </g>
